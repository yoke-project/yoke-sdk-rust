[package]
name = "yoke-plugin-harness"
description = "The Rust plugin library's harness, which the conformance suite drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yoke-rust-plugin-harness"
path = "src/main.rs"

[dependencies]
yoke-base = { path = "../base" }
yoke-plugin = { path = "../plugin" }
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
yoke-proto.workspace = true
tonic = { workspace = true, features = ["router", "server"] }
tokio-stream.workspace = true
prost-types.workspace = true
