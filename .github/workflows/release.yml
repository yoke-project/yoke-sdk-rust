# A release's tag runs this repository's release verb where the tag is seen. The verb's lines are the
# run's output the release command collects; it appends them to the manifest itself.
name: release

on:
  push:
    tags: ['v*']

# The verb publishes the crate under a credential the run's identity is exchanged for: nothing is stored.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The verb reads which tags name this commit.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.94.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # crates.io exchanges the run's identity only for a crate that exists and trusts this workflow, so
      # until then the exchange is refused and the verb says the crate was not published.
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      - run: just release > manifest-lines.jsonl
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-lines
          path: manifest-lines.jsonl
