# The Rust family: one crate, yoke-sdk, carrying the base and the libraries over it as its modules, and
# the harness beside it, which is never published.
[package]
name = "yoke-sdk"
description = "The Rust libraries of Yoke: the base, and the library a Plugin unit is written with"
repository = "https://github.com/yoke-project/yoke-sdk-rust"
include = ["src/**", "LICENSE", "NOTICE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
yoke-proto.workspace = true
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
socket2.workspace = true

[dev-dependencies]
socket2.workspace = true
tonic = { workspace = true, features = ["router", "server"] }
prost-types.workspace = true

[workspace]
members = [".", "harness"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
yoke-proto = "=0.2.0"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
socket2 = { version = "0.6", features = ["all"] }
