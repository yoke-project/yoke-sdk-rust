# The Rust family: one crate, yoke-sdk, carrying the base and the libraries over it as its modules, and
# the harness beside it, which is never published.
[package]
name = "yoke-sdk"
description = "The Rust libraries of Yoke: the base, and the library a Plugin unit is written with"
repository = "https://github.com/yoke-project/yoke-sdk-rust"
include = ["src/**", "LICENSE", "NOTICE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
yoke-proto.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
hyper-util.workspace = true
tower.workspace = true
socket2.workspace = true
rustix.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
socket2.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["tls12"] }
tonic = { workspace = true, features = ["router", "server"] }

[workspace]
members = [".", "harness", "interface-harness"]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
yoke-proto = "=0.4.0"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
socket2 = { version = "0.6", features = ["all"] }
rustix = { version = "1", features = ["fs", "mm", "net", "thread"] }
# TLS 1.3 alone: a crypto provider with no TLS 1.2 code in it, and the handshake done here, so a channel at a
# routable address takes nothing below it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.14"
